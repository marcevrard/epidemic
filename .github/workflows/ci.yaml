name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify lockfile and install dependencies
        run: uv sync --locked

      - name: Test dashboard build
        run: uv run build-dashboard

      - name: Verify generated static site
        run: |
          if [ ! -s "_site/index.html" ]; then
            echo "Error: _site/index.html does not exist or is empty." >&2
            exit 1
          fi
          echo "Verified _site/index.html ($(wc -c < _site/index.html) bytes)."