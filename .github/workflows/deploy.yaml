name: Update Epidemic Dashboard and Deploy to Pages

on:
  schedule:
    # Runs once daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --no-dev

      - name: Fetch latest epidemiological data
        run: uv run build-dashboard

      - name: Commit and push updated CSV snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): daily epidemiological data update"
            for attempt in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "Failed to push updated data snapshots after 3 attempts." >&2
                exit 1
              fi
              sleep 2
            done
          fi

  deploy-pages:
    needs: update-data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest branch tip
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --no-dev

      - name: Build Plotly dashboard
        run: uv run build-dashboard

      - name: Verify generated static site
        run: |
          if [ ! -s "_site/index.html" ]; then
            echo "Error: _site/index.html does not exist or is empty." >&2
            exit 1
          fi
          echo "Verified _site/index.html ($(wc -c < _site/index.html) bytes)."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4